# DonburiX di https://<IP>/DonburiX/ untuk VPS, Raspberry Pi, atau Orange Pi.
# Dipasang oleh scripts/server-setup.sh ke /etc/nginx/conf.d/donburix.conf.
# File build berada di /var/www/donburix/DonburiX/.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Dipakai ACME http-01 bila sertifikat tepercaya dipasang.
    location /.well-known/acme-challenge/ {
        root /var/www/donburix-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/ssl/donburix/fullchain.pem;
    ssl_certificate_key /etc/ssl/donburix/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/donburix;

    # Nama file build tidak memakai hash, jadi browser selalu memvalidasi ulang
    # (ETag, jawaban 304) agar versi baru langsung terpakai setelah deploy.
    add_header Cache-Control "no-cache" always;

    # Header yang tidak bisa dipasang di GitHub Pages (risiko R6 Tugas 8).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml font/otf font/ttf;

    location = / {
        return 302 /DonburiX/;
    }
    location = /DonburiX {
        return 301 /DonburiX/;
    }
    location /DonburiX/ {
        index index.html;
        try_files $uri $uri/ =404;
    }
    # nginx lama belum mengenal .wasm; tanpa tipe ini CanvasKit gagal dimuat.
    location ~ ^/DonburiX/.+\.wasm$ {
        types { }
        default_type application/wasm;
    }
    location / {
        return 404;
    }
}
