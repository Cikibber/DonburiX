<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DonburiX: racik rice bowl sendiri, pesan takeaway atau dine-in, lalu lacak status pesanan.">
  <meta name="theme-color" content="#C44D29">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DonburiX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DonburiX • Racik Bowl</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #FFF9F1; }
    #loading, noscript p {
      position: fixed; inset: 0; margin: 0; padding: 24px;
      display: grid; place-items: center; text-align: center;
      font: 600 16px system-ui, sans-serif; color: #272A21;
    }
  </style>
</head>
<body>
  <!-- Tampil selama main.dart.js dan CanvasKit dimuat; dihapus splash.js. -->
  <div id="loading" role="status">Memuat DonburiX…</div>
  <noscript>
    <style>#loading { display: none; }</style>
    <p>DonburiX memerlukan JavaScript. Aktifkan JavaScript lalu muat ulang halaman.</p>
  </noscript>
  <script src="splash.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
